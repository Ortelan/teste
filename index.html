<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A LORENA ESTÁ MENTINDO?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden; /* Evita que a tela crie barras de rolagem */
            touch-action: none; /* Melhora a experiência em dispositivos móveis */
        }

        #btn-nao {
            transition: top 0.2s ease-out, left 0.2s ease-out; /* Animação suave na fuga */
            z-index: 50;
        }
        
        .assumiu-anim {
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex flex-col items-center justify-center m-0 p-0 text-white selection:bg-pink-300">

    <div id="main-content" class="text-center px-4 z-10 w-full flex flex-col items-center">
        
        <h1 id="title" class="text-4xl md:text-7xl font-extrabold mb-10 md:mb-12 drop-shadow-lg text-center leading-tight">
            A LORENA ESTÁ<br>MENTINDO?
        </h1>

        <div id="buttons-container" class="flex flex-row gap-4 md:gap-8 items-center justify-center relative w-full h-24">
            
            <button id="btn-sim" class="bg-green-500 hover:bg-green-400 text-white text-xl md:text-3xl font-bold py-3 px-8 md:py-4 md:px-10 rounded-full shadow-[0_8px_0_rgb(21,128,61)] hover:shadow-[0_4px_0_rgb(21,128,61)] hover:translate-y-1 transition-all active:shadow-none active:translate-y-2 cursor-pointer z-10">
                SIM
            </button>

            <!-- O botão NÃO inicialmente fica no fluxo flex, depois ganha posição absoluta -->
            <button id="btn-nao" class="bg-red-500 hover:bg-red-400 text-white text-xl md:text-3xl font-bold py-3 px-8 md:py-4 md:px-10 rounded-full shadow-[0_8px_0_rgb(185,28,28)] cursor-pointer">
                NÃO
            </button>

        </div>
    </div>

    <script>
        const btnNao = document.getElementById('btn-nao');
        const btnSim = document.getElementById('btn-sim');
        const title = document.getElementById('title');
        const buttonsContainer = document.getElementById('buttons-container');
        
        let isFirstMove = true;

        // Função para mover o botão para um local aleatório
        const moverBotaoNao = () => {
            // Se for o primeiro movimento, tira ele do flexbox e coloca posição fixa
            if (isFirstMove) {
                btnNao.style.position = 'fixed';
                isFirstMove = false;
            }

            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            
            const naoRect = btnNao.getBoundingClientRect();
            const simRect = btnSim.getBoundingClientRect();

            let novoX, novoY;
            let sobrepondo = true;
            let tentativas = 0;
            const espacoSeguro = 40; // Margem de segurança aumentada para toques (dedos)

            // Tenta encontrar uma posição que não seja em cima do botão SIM
            while (sobrepondo && tentativas < 100) {
                // Sorteia as coordenadas garantindo que o botão não saia da tela, com uma margem extra
                const margem = 20; 
                novoX = Math.random() * (viewportWidth - naoRect.width - (margem * 2)) + margem;
                novoY = Math.random() * (viewportHeight - naoRect.height - (margem * 2)) + margem;

                // Verifica se a nova posição invade o espaço do botão SIM
                const invasaoX = novoX < (simRect.right + espacoSeguro) && (novoX + naoRect.width) > (simRect.left - espacoSeguro);
                const invasaoY = novoY < (simRect.bottom + espacoSeguro) && (novoY + naoRect.height) > (simRect.top - espacoSeguro);

                // Se não invadiu X ou não invadiu Y, então não está sobrepondo
                if (!invasaoX || !invasaoY) {
                    sobrepondo = false;
                }
                tentativas++;
            }
            // Aplica as novas posições
            btnNao.style.left = `${novoX}px`;
            btnNao.style.top = `${novoY}px`;
        };

        // Foge quando passa o mouse por cima (PC)
        btnNao.addEventListener('mouseover', moverBotaoNao);
        
        // Foge quando tenta tocar (Celular)
        btnNao.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Evita que o toque gere um clique fantasma
            moverBotaoNao();
        });

        // Caso a pessoa consiga clicar rápido o suficiente pelo teclado (tab + enter), ele foge também
        btnNao.addEventListener('focus', moverBotaoNao);

        // O que acontece quando a pessoa clica no botão "SIM"
        btnSim.addEventListener('click', () => {
            // Some com os botões
            buttonsContainer.style.display = 'none';
            
            // Muda o texto e reduz o tamanho da fonte para não quebrar em telas estreitas
            title.innerHTML = "ATÉ Q ENFIM<br>ASSUMIU! 🎉";
            title.className = "text-4xl sm:text-6xl md:text-8xl font-extrabold text-yellow-300 drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)] text-center assumiu-anim leading-tight px-2";
            
            // Muda o fundo para uma cor de sucesso vibrante
            document.body.className = "bg-gradient-to-r from-green-400 to-blue-500 min-h-screen flex flex-col items-center justify-center m-0 p-0 text-white overflow-hidden";
        });
    </script>
</body>
</html>
