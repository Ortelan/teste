<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contrato Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@600&display=swap" rel="stylesheet">
    
    <style>
        /* Fontes customizadas */
        .font-serif-formal { font-family: 'Playfair Display', serif; }
        .font-sans-heart { font-family: 'Poppins', sans-serif; }

        /* Comportamento geral do corpo */
        body {
            overflow: hidden;
            touch-action: none;
            background-color: #ffffff; /* Fundo inicial branco */
            transition: background-color 1s ease;
        }

        /* Animação do coração pulsante (Cena 1) */
        @keyframes heartBeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.2); }
            60% { transform: scale(1); }
            100% { transform: scale(1); }
        }
        .animate-beat {
            animation: heartBeat 1.5s infinite ease-in-out;
        }

        /* Transições de opacidade para as cenas */
        .fade-transition {
            transition: opacity 1s ease-in-out;
        }

        /* Estilo do fundo de pergaminho (Cena 2) */
        .bg-parchment {
            background-color: #fdf6e3;
            background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.05' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
        }

        /* Borda dupla do contrato */
        .contract-border {
            border: 8px double #5c4a3d;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center m-0 p-0 text-gray-800">

    <!-- CENA 1: Coração Pulsante no Fundo Branco -->
    <div id="scene-1" class="fixed inset-0 flex items-center justify-center bg-white fade-transition opacity-100 z-50">
        <svg class="w-40 h-40 md:w-56 md:h-56 text-red-500 animate-beat drop-shadow-[0_0_20px_rgba(239,68,68,0.4)]" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
    </div>

    <!-- CENA 2: O Contrato -->
    <div id="scene-2" class="fixed inset-0 flex items-center justify-center bg-parchment fade-transition opacity-0 hidden z-40 p-4 md:p-8">
        
        <!-- Documento com Borda -->
        <div class="contract-border w-full max-w-md h-full max-h-[85vh] bg-white bg-opacity-60 flex flex-col items-center justify-between py-10 px-6 md:px-10 rounded-sm relative overflow-hidden">
            
            <!-- Título do Contrato -->
            <div class="text-center w-full">
                <h1 class="font-serif-formal text-3xl md:text-4xl font-bold tracking-widest text-[#4a3f35] border-b-2 border-[#5c4a3d] pb-4 inline-block uppercase">
                    Contrato Oficial
                </h1>
            </div>

            <!-- Coração Central com Texto -->
            <div class="relative flex items-center justify-center w-full my-8">
                <!-- SVG do Coração Ajustado -->
                <svg class="w-64 h-64 md:w-72 md:h-72 text-red-600 drop-shadow-xl" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                
                <!-- Texto centralizado exatamente dentro do svg -->
                <div class="absolute inset-0 flex flex-col items-center justify-center pb-4 pt-2">
                    <span class="font-sans-heart text-white text-xl md:text-2xl tracking-wide uppercase text-center leading-snug drop-shadow-md">
                        está<br>me<br>devendo
                    </span>
                </div>
            </div>

            <!-- Área de Assinatura -->
            <div class="w-full mt-auto pt-6 flex flex-col items-center">
                <div class="w-3/4 border-b-2 border-dotted border-[#5c4a3d] mb-2"></div>
                <p class="font-serif-formal text-[#5c4a3d] text-lg uppercase tracking-wider">
                    Assinatura
                </p>
            </div>

        </div>
    </div>

    <script>
        // Lógica de tempo e transição usando Javascript Vanilla
        window.onload = () => {
            const scene1 = document.getElementById('scene-1');
            const scene2 = document.getElementById('scene-2');
            const body = document.body;

            // Aguarda 3 segundos com o coração batendo
            setTimeout(() => {
                // Inicia o fade out da cena 1
                scene1.classList.remove('opacity-100');
                scene1.classList.add('opacity-0');
                
                // Muda a cor de fundo do body por baixo para o pergaminho
                body.classList.add('bg-parchment');

                // Após 1 segundo de transição de fade-out...
                setTimeout(() => {
                    // Esconde a cena 1 totalmente
                    scene1.classList.add('hidden');
                    
                    // Prepara a cena 2
                    scene2.classList.remove('hidden');
                    // Força um reflow do navegador (necessário para o fade-in CSS funcionar logo após remover display:none)
                    void scene2.offsetWidth; 
                    
                    // Inicia o fade-in da cena 2 (contrato)
                    scene2.classList.remove('opacity-0');
                    scene2.classList.add('opacity-100');
                    
                }, 1000); // Tempo do fade out do coração (1 segundo)

            }, 3000); // 3 Segundos exibindo o coração gigante
        };
    </script>
</body>
</html>
