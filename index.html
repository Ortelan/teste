<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contrato Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteca para transformar o HTML em Imagem -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Poppins:wght@400;600&display=swap');

        body {
            margin: 0;
            overflow-x: hidden;
            background-color: #fdf6e3; /* Cor base de pergaminho */
        }

        /* Textura de papel antigo */
        .paper-texture {
            position: relative;
            background-color: #fdf6e3;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.1), 0 10px 25px rgba(0,0,0,0.2);
        }
        .paper-texture::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.4;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .contract-border {
            border: 8px double #4a3f35;
        }

        .heart-pulse {
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        /* Área de assinatura bloqueia o scroll da tela no celular ao desenhar */
        #signature-pad {
            touch-action: none;
        }
    </style>
</head>
<body class="antialiased text-stone-800">

    <!-- TELA 1: Coração Pulsante Inicial -->
    <div id="intro-screen" class="fixed inset-0 bg-pink-50 flex items-center justify-center z-50 transition-opacity duration-1000">
        <svg class="heart-pulse w-32 h-32 md:w-48 md:h-48 text-red-500 drop-shadow-2xl" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
    </div>

    <!-- TELA 2: Contrato Oficial (Escondido no início) -->
    <div id="contract-screen" class="min-h-screen flex items-center justify-center p-4 opacity-0 hidden transition-opacity duration-1000 relative">
        
        <!-- Caixa do Contrato (Isso será baixado como imagem) -->
        <div id="contract-box" class="paper-texture contract-border p-6 md:p-10 w-full max-w-md relative z-10 flex flex-col items-center text-center mt-8 mb-8">
            
            <h1 class="font-['Cinzel'] text-3xl md:text-4xl font-bold mb-6 text-stone-900 border-b-2 border-stone-800 pb-2">
                CONTRATO OFICIAL
            </h1>

            <p class="font-['Poppins'] text-sm md:text-base mb-6 text-stone-700 leading-relaxed">
                Pelo presente instrumento, a parte assinante reconhece e confessa publicamente o seguinte fato irrevogável:
            </p>

            <!-- Coração com Texto Dentro -->
            <div class="relative w-48 h-48 md:w-56 md:h-56 flex items-center justify-center mb-8 mx-auto">
                <svg class="absolute inset-0 w-full h-full text-red-600 drop-shadow-md" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                <span class="relative z-10 font-['Poppins'] font-bold text-white text-xl md:text-2xl text-center leading-tight px-4 mt-[-10px]">
                    ESTÁ ME<br>DEVENDO<br>UM BEIJO
                </span>
            </div>

            <!-- Área de Assinatura -->
            <div class="w-full mt-4">
                <p class="font-['Poppins'] text-xs text-stone-500 mb-1 text-left">Assine aqui para concordar:</p>
                <div class="border-b-2 border-stone-800 bg-white/40 rounded-t-lg shadow-inner relative">
                    <canvas id="signature-pad" class="w-full h-32 cursor-crosshair rounded-t-lg"></canvas>
                </div>
                <p class="font-['Great_Vibes'] text-2xl mt-2 text-stone-700">Lorena</p>
            </div>

            <!-- Botões de Ação (Serão escondidos na hora de tirar a foto) -->
            <div id="action-buttons" class="flex gap-4 mt-8 w-full justify-center" data-html2canvas-ignore="true">
                <button onclick="clearPad()" class="px-4 py-2 bg-stone-300 text-stone-800 font-bold rounded-lg shadow active:scale-95 transition-transform text-sm">
                    Limpar
                </button>
                <button onclick="downloadContract()" class="px-4 py-2 bg-red-600 text-white font-bold rounded-lg shadow active:scale-95 transition-transform text-sm">
                    Baixar Contrato
                </button>
            </div>
            
        </div>
    </div>

    <script>
        // --- 1. Lógica de Transição das Telas ---
        setTimeout(() => {
            const intro = document.getElementById('intro-screen');
            const contract = document.getElementById('contract-screen');
            
            // Apaga o coração
            intro.style.opacity = '0';
            
            setTimeout(() => {
                intro.style.display = 'none';
                contract.classList.remove('hidden');
                
                // Mostra o contrato suavemente
                setTimeout(() => {
                    contract.style.opacity = '1';
                    resizeCanvas(); // Ajusta o tamanho da área de assinatura quando ela aparecer
                }, 50);
            }, 1000);
        }, 3000); // 3 segundos de coração pulsando

        // --- 2. Lógica da Área de Assinatura (Canvas) ---
        const canvas = document.getElementById('signature-pad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        // Ajusta a resolução interna do canvas para evitar traço borrado
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#1c1917'; // Cor da "tinta" da caneta (Stone 900)
        }

        // Pega as coordenadas exatas do mouse ou do dedo no celular
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches) {
                return {
                    x: e.touches[0].clientX - rect.left,
                    y: e.touches[0].clientY - rect.top
                };
            }
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault(); // Evita que a tela role no celular enquanto assina
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            e.preventDefault();
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.closePath();
        }

        // Eventos para Mouse (Computador)
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        // Eventos para Touch (Celular)
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        // Limpar a assinatura
        function clearPad() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // --- 3. Lógica para Baixar o Contrato como Imagem ---
        function downloadContract() {
            const contractBox = document.getElementById('contract-box');
            const buttons = document.getElementById('action-buttons');
            
            // Oculta os botões temporariamente para eles não aparecerem na foto
            buttons.style.display = 'none';

            // Tira o "print" do elemento HTML e converte em Canvas
            html2canvas(contractBox, { 
                backgroundColor: '#fdf6e3', // Garante a cor de fundo correta na foto
                scale: 2 // Melhora a qualidade da imagem gerada
            }).then(canvasResult => {
                // Cria o link de download mágico
                const link = document.createElement('a');
                link.download = 'Contrato_da_Lorena.png';
                link.href = canvasResult.toDataURL('image/png');
                link.click();
                
                // Mostra os botões de volta
                buttons.style.display = 'flex';
            });
        }
    </script>
</body>
</html>
